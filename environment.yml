name: masterresearch
channels:
  - conda-forge
dependencies:
  - python=3.11
  - earthengine-api
  - geopandas=1.0
  - fiona=1.10
  - gdal=3.10
  - pyproj=3.7
  - shapely=2.0
  - pandas=2.2
  - numpy=1.26
  - scipy
  - scikit-learn
  - matplotlib
  - shap
  - tqdm=4.67
  - rasterio=1.4
  # NASA Black Marble（VNP46A4）は HDF-EOS5 配布で、本環境の GDAL は HDF5 ドライバ
  # なしでビルドされているため h5py が必須
  - h5py=3.16
  - requests=2.32
  - pyyaml
  - ruff
  - pre-commit
  - pytest
  - pip
