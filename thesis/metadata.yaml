# --- pandoc-crossref ---
# 図・表の番号は文書通し（章ごとにしない）。卒業論文の「図-1　題目」「表-1　題目」に合わせ、
# 番号の接頭辞と題目の区切り（全角スペース）を指定する。本文中の参照も「図-1」とする。
figureTitle: "図"
tableTitle: "表"
figPrefix: "図"
tblPrefix: "表"
eqnPrefix: "式"
titleDelim: "　"
figureTemplate: "$$figureTitle$$-$$i$$$$titleDelim$$$$t$$"
tableTemplate: "$$tableTitle$$-$$i$$$$titleDelim$$$$t$$"
figPrefixTemplate: "$$p$$-$$i$$"
tblPrefixTemplate: "$$p$$-$$i$$"
eqnPrefixTemplate: "$$p$$($$i$$)"
