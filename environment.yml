name: masterresearch
channels:
  - conda-forge
dependencies:
  - python=3.11
  - earthengine-api
  - geopandas=1.0
  - fiona=1.10
  # geopandas の推移的依存でもあるが、属性のみのGeoPackage書き出しと列を絞った
  # 読み出しのために直接importしているため、明示的に宣言する
  - pyogrio=0.11
  - gdal=3.10
  - pyproj=3.7
  # esda 2.7 以降が shapely>=2.1 を要求するため 2.1 とする（GEOS は 3.13.1 で変わらない）
  - shapely=2.1
  - pandas=2.2
  - numpy=1.26
  - scipy
  # cohen_kappa_score の replace_undefined_by は1.9以降で使用可能なため下限を明示する
  - scikit-learn>=1.9
  # Axes.set_xticks(labels=...) は3.5.0以降で使用可能なため下限を明示する
  - matplotlib>=3.5
  # 動作確認済みバージョンを下限として明示する
  - shap>=0.48
  # Spatial CV のブロック設計の診断に使う（残差の距離帯ごとの Moran's I と、LST の
  # 経験セミバリオグラム）。検定・重み・ラグ境界・理論モデルの当てはめは誤りやすいため、
  # 検証済みの実装を用い、数値が版で動かないよう導入時の版に固定する
  - esda=2.7.1
  - libpysal=4.14.1
  - scikit-gstat=1.0.22
  # 多重共線性の診断（VIF）に検証済みの実装を用いる。数値が版で動かないよう導入時の
  # 版に固定する
  - statsmodels=0.15.0
  - tqdm=4.67
  - rasterio=1.4
  # NASA Black Marble（VNP46A4）は HDF-EOS5 配布で、本環境の GDAL は HDF5 ドライバ
  # なしでビルドされているため h5py が必須
  - h5py=3.16
  - requests=2.32
  - pyyaml
  # CI（.github/workflows/ci.yml）と pre-commit のフックに合わせて固定する。
  # ローカルの lint が別バージョンだと、手元で通してから CI の lint だけが落ちる
  - ruff=0.16.0
  - pre-commit
  - pytest
  # 修士論文（thesis/）の md → docx 生成に使う。pandoc-crossref はビルド時の pandoc と
  # 実行時の pandoc の版が違うと「非サポート」の警告を出すため、両者を組で固定する。
  # conda-forge の 0.3.26 は依存指定が pandoc <3.10 だが、実体は pandoc 3.13 でビルド
  # されており版が合わない。0.3.24 は pandoc 3.9.0.2 でビルドされている
  # （pandoc-crossref --version で確認できる）
  - pandoc=3.9.0.2
  - pandoc-crossref=0.3.24
  - pip
